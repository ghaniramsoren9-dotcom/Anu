name: Apply Anu TimePicker Integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply TimePicker integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/ghaniram/zoya/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          import_line = "import com.ghaniram.zoya.ui.TimePickerWithPresetsDialog\n"
          if import_line not in text:
              marker = "import com.ghaniram.zoya.ui.theme.*\n"
              if marker not in text:
                  raise SystemExit("Could not find theme import marker")
              text = text.replace(marker, marker + import_line, 1)

          old = '''                    OutlinedTextField(
                        value = newTaskTime,
                        onValueChange = { newTaskTime = it },
                        label = { Text("Time (e.g. 7:00 PM)") },
                        singleLine = true,
                        modifier = Modifier.fillMaxWidth()
                    )'''

          new = '''                    var showTimePickerDialog by remember { mutableStateOf(false) }

                    OutlinedTextField(
                        value = newTaskTime,
                        onValueChange = { newTaskTime = it },
                        label = { Text("Time (e.g. 7:00 PM)") },
                        singleLine = true,
                        trailingIcon = {
                            IconButton(onClick = { showTimePickerDialog = true }) {
                                Icon(
                                    Icons.Filled.Schedule,
                                    contentDescription = "Pick Time",
                                    tint = MaterialTheme.colorScheme.primary
                                )
                            }
                        },
                        modifier = Modifier.fillMaxWidth()
                    )
                    Spacer(modifier = Modifier.height(6.dp))
                    Text(
                        text = "Quick Presets:",
                        fontSize = 11.sp,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                    Spacer(modifier = Modifier.height(4.dp))
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.spacedBy(6.dp)
                    ) {
                        listOf(15 to "+15m", 30 to "+30m", 60 to "+1h").forEach { (min, label) ->
                            AssistChip(
                                onClick = {
                                    val cal = Calendar.getInstance().apply { add(Calendar.MINUTE, min) }
                                    val ampm = if (cal.get(Calendar.AM_PM) == Calendar.AM) "AM" else "PM"
                                    val h = if (cal.get(Calendar.HOUR) == 0) 12 else cal.get(Calendar.HOUR)
                                    newTaskTime = String.format(Locale.US, "%d:%02d %s", h, cal.get(Calendar.MINUTE), ampm)
                                },
                                label = { Text(label, fontSize = 11.sp) }
                            )
                        }
                        AssistChip(
                            onClick = { showTimePickerDialog = true },
                            label = { Text("🕒 Clock", fontSize = 11.sp) }
                        )
                    }
                    if (showTimePickerDialog) {
                        TimePickerWithPresetsDialog(
                            onConfirm = { hour, minute ->
                                val ampm = if (hour >= 12) "PM" else "AM"
                                val h12 = if (hour % 12 == 0) 12 else hour % 12
                                newTaskTime = String.format(Locale.US, "%d:%02d %s", h12, minute, ampm)
                                showTimePickerDialog = false
                            },
                            onDismiss = {
                                showTimePickerDialog = false
                            }
                        )
                    }'''

          if old in text:
              text = text.replace(old, new, 1)
          elif "TimePickerWithPresetsDialog(" in text:
              print("TimePicker integration already present; no replacement needed.")
          else:
              raise SystemExit("Could not find the existing newTaskTime OutlinedTextField block")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify integration
        run: |
          grep -q 'TimePickerWithPresetsDialog' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'Quick Presets:' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'AssistChip' app/src/main/java/com/ghaniram/zoya/MainActivity.kt

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add task time picker quick presets"
          git push