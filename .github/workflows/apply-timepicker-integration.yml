name: Apply Anu TimePicker Integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply TimePicker integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/ghaniram/zoya/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          import_line = "import com.ghaniram.zoya.ui.TimePickerWithPresetsDialog\n"
          if import_line not in text:
              marker = "import com.ghaniram.zoya.ui.theme.*\n"
              if marker not in text:
                  raise SystemExit("Could not find theme import marker")
              text = text.replace(marker, marker + import_line, 1)

          pattern = re.compile(
              r'(?m)^(?P<i>\s*)OutlinedTextField\(\n'
              r'(?P=i)    value = newTaskTime,\n'
              r'(?P=i)    onValueChange = \{ newTaskTime = it \},\n'
              r'(?P=i)    label = \{ Text\("Time \(e\.g\. 7:00 PM\)"\) \},\n'
              r'(?P=i)    singleLine = true,\n'
              r'(?P=i)    modifier = Modifier\.fillMaxWidth\(\)\n'
              r'(?P=i)\)'
          )

          new_block = '''{i}var showTimePickerDialog by remember {{ mutableStateOf(false) }}

{i}OutlinedTextField(
{i}    value = newTaskTime,
{i}    onValueChange = {{ newTaskTime = it }},
{i}    label = {{ Text("Time (e.g. 7:00 PM)") }},
{i}    singleLine = true,
{i}    trailingIcon = {{
{i}        IconButton(onClick = {{ showTimePickerDialog = true }}) {{
{i}            Icon(
{i}                Icons.Filled.Schedule,
{i}                contentDescription = "Pick Time",
{i}                tint = MaterialTheme.colorScheme.primary
{i}            )
{i}        }}
{i}    }},
{i}    modifier = Modifier.fillMaxWidth()
{i})
{i}Spacer(modifier = Modifier.height(6.dp))
{i}Text(
{i}    text = "Quick Presets:",
{i}    fontSize = 11.sp,
{i}    color = MaterialTheme.colorScheme.onSurfaceVariant
{i})
{i}Spacer(modifier = Modifier.height(4.dp))
{i}Row(
{i}    modifier = Modifier.fillMaxWidth(),
{i}    horizontalArrangement = Arrangement.spacedBy(6.dp)
{i}) {{
{i}    listOf(15 to "+15m", 30 to "+30m", 60 to "+1h").forEach {{ (min, label) ->
{i}        AssistChip(
{i}            onClick = {{
{i}                val cal = Calendar.getInstance().apply {{ add(Calendar.MINUTE, min) }}
{i}                val ampm = if (cal.get(Calendar.AM_PM) == Calendar.AM) "AM" else "PM"
{i}                val h = if (cal.get(Calendar.HOUR) == 0) 12 else cal.get(Calendar.HOUR)
{i}                newTaskTime = String.format(Locale.US, "%d:%02d %s", h, cal.get(Calendar.MINUTE), ampm)
{i}            }},
{i}            label = {{ Text(label, fontSize = 11.sp) }}
{i}        )
{i}    }}
{i}    AssistChip(
{i}        onClick = {{ showTimePickerDialog = true }},
{i}        label = {{ Text("🕒 Clock", fontSize = 11.sp) }}
{i}    )
{i}}}
{i}if (showTimePickerDialog) {{
{i}    TimePickerWithPresetsDialog(
{i}        onConfirm = {{ hour, minute ->
{i}            val ampm = if (hour >= 12) "PM" else "AM"
{i}            val h12 = if (hour % 12 == 0) 12 else hour % 12
{i}            newTaskTime = String.format(Locale.US, "%d:%02d %s", h12, minute, ampm)
{i}            showTimePickerDialog = false
{i}        }},
{i}        onDismiss = {{
{i}            showTimePickerDialog = false
{i}        }}
{i}    )
{i}}}'''

          match = pattern.search(text)
          if match:
              replacement = new_block.format(i=match.group("i"))
              text = text[:match.start()] + replacement + text[match.end():]
          elif "TimePickerWithPresetsDialog(" in text:
              print("TimePicker integration already present; no replacement needed.")
          else:
              raise SystemExit("Could not find the existing newTaskTime OutlinedTextField block")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify integration
        run: |
          grep -q 'TimePickerWithPresetsDialog' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'Quick Presets:' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'AssistChip' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'Icons.Filled.Schedule' app/src/main/java/com/ghaniram/zoya/MainActivity.kt

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add task time picker quick presets"
          git push