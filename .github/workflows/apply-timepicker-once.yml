name: One-time Anu TimePicker Patch
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ghaniram/zoya/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          if 'import com.ghaniram.zoya.ui.TimePickerWithPresetsDialog' not in s:
              s=s.replace('import com.ghaniram.zoya.ui.theme.*\n','import com.ghaniram.zoya.ui.theme.*\nimport com.ghaniram.zoya.ui.TimePickerWithPresetsDialog\n',1)
          needle='''                    OutlinedTextField(\n                        value = newTaskTime,\n                        onValueChange = { newTaskTime = it },\n                        label = { Text("Time (e.g. 7:00 PM)") },\n                        singleLine = true,\n                        modifier = Modifier.fillMaxWidth()\n                    )'''
          block='''                    var showTimePickerDialog by remember { mutableStateOf(false) }\n\n                    OutlinedTextField(\n                        value = newTaskTime,\n                        onValueChange = { newTaskTime = it },\n                        label = { Text("Time (e.g. 7:00 PM)") },\n                        singleLine = true,\n                        trailingIcon = {\n                            IconButton(onClick = { showTimePickerDialog = true }) {\n                                Icon(Icons.Filled.Schedule, contentDescription = "Pick Time", tint = MaterialTheme.colorScheme.primary)\n                            }\n                        },\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(6.dp))\n                    Text("Quick Presets:", fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                    Spacer(modifier = Modifier.height(4.dp))\n                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                        listOf(15 to "+15m", 30 to "+30m", 60 to "+1h").forEach { (min, label) ->\n                            AssistChip(\n                                onClick = {\n                                    val cal = Calendar.getInstance().apply { add(Calendar.MINUTE, min) }\n                                    val ampm = if (cal.get(Calendar.AM_PM) == Calendar.AM) "AM" else "PM"\n                                    val h = if (cal.get(Calendar.HOUR) == 0) 12 else cal.get(Calendar.HOUR)\n                                    newTaskTime = String.format(Locale.US, "%d:%02d %s", h, cal.get(Calendar.MINUTE), ampm)\n                                },\n                                label = { Text(label, fontSize = 11.sp) }\n                            )\n                        }\n                        AssistChip(onClick = { showTimePickerDialog = true }, label = { Text("🕒 Clock", fontSize = 11.sp) })\n                    }\n                    if (showTimePickerDialog) {\n                        TimePickerWithPresetsDialog(\n                            onConfirm = { hour, minute ->\n                                val ampm = if (hour >= 12) "PM" else "AM"\n                                val h12 = if (hour % 12 == 0) 12 else hour % 12\n                                newTaskTime = String.format(Locale.US, "%d:%02d %s", h12, minute, ampm)\n                                showTimePickerDialog = false\n                            },\n                            onDismiss = { showTimePickerDialog = false }\n                        )\n                    }'''
          if 'TimePickerWithPresetsDialog(' not in s:
              if needle not in s: raise SystemExit('newTaskTime field not found')
              s=s.replace(needle,block,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'TimePickerWithPresetsDialog(' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'Quick Presets:' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
      - name: Commit source and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          git rm .github/workflows/apply-timepicker-once.yml
          git commit -m 'feat: add task time picker quick presets'
          git push
