name: Restore Anu MainActivity safely

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anu-mainactivity-restore
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[skip anu restore]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known complete MainActivity implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout f8eec1057d55ea87f693a17534cb349c26011b8a -- app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          # The f8 baseline is complete, but contained the compiler-incompatible
          # focusable modifier. Remove only that modifier; preserve all other UI/code.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ghaniram/zoya/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('                            modifier = Modifier\n                                .fillMaxWidth()\n                                .focusable(),', '                            modifier = Modifier.fillMaxWidth(),')
          if s2 == s:
              s2 = s.replace('.focusable(),', ',')
          p.write_text(s2, encoding='utf-8')
          if 'focusable()' in s2:
              raise SystemExit('ERROR: incompatible focusable() modifier still present')
          if 'class MainActivity : ComponentActivity()' not in s2:
              raise SystemExit('ERROR: MainActivity class was not restored')
          print('MainActivity restored and focusable() removed safely.')
          PY

      - name: Commit only when restoration changed the tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Anu Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'MainActivity is already restored; nothing to commit.'
            exit 0
          fi
          git commit -m '[Anu repair] Restore complete MainActivity safely [skip anu restore]'
          git push origin HEAD:main
