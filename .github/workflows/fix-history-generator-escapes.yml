name: Fix conversation generator Kotlin escapes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Python generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/apply_conversation_history.py")
          s = p.read_text(encoding="utf-8")
          old = '    helper = """    private fun conversationMarker'
          new = '    helper = r"""    private fun conversationMarker'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("Fixed Kotlin escape generation in apply_conversation_history.py")
          else:
              print("Conversation helper already uses a raw Python string or was not found")
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_conversation_history.py
          git commit -m "fix: preserve Kotlin regex escapes in conversation generator"
          git push
