name: Build Anu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anu-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore and diagnose permanent Anu signing keystore
        shell: bash
        env:
          ANU_KEYSTORE_BASE64: ${{ secrets.ANU_KEYSTORE_BASE64 }}
          ANU_KEYSTORE_PASSWORD: ${{ secrets.ANU_KEYSTORE_PASSWORD }}
        run: |
          set -u
          test -n "$ANU_KEYSTORE_BASE64" || { echo "ERROR: ANU_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$ANU_KEYSTORE_PASSWORD" || { echo "ERROR: ANU_KEYSTORE_PASSWORD is empty"; exit 1; }
          printf '%s' "$ANU_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > anu-release.jks 2>/tmp/anu-base64.err
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: Base64 decode failed (exit $rc)."
            cat /tmp/anu-base64.err
            exit 1
          fi
          size=$(wc -c < anu-release.jks)
          echo "Decoded keystore size: $size bytes"
          test "$size" -gt 0 || { echo "ERROR: decoded keystore is empty"; exit 1; }
          echo "Keystore file type:"
          file anu-release.jks || true
          echo "Attempting keystore discovery without printing secrets..."
          set +e
          keytool -list -keystore anu-release.jks -storepass "$ANU_KEYSTORE_PASSWORD" >/tmp/anu-keytool.out 2>/tmp/anu-keytool.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "KEYTOOL_EXIT=$rc"
            echo "KEYTOOL_ERROR_BEGIN"
            sed -E 's/(password|storepass|keypass)[^:]*:.*/\1: [REDACTED]/Ig' /tmp/anu-keytool.err | head -20
            echo "KEYTOOL_ERROR_END"
            echo "Trying supported keystore types..."
            for type in JKS PKCS12; do
              set +e
              keytool -list -storetype "$type" -keystore anu-release.jks -storepass "$ANU_KEYSTORE_PASSWORD" >/dev/null 2>/tmp/anu-${type}.err
              trc=$?
              set -e
              echo "$type exit=$trc"
            done
            exit 1
          fi
          echo "Keystore opened successfully."
          if ! keytool -list -keystore anu-release.jks -alias anu -storepass "$ANU_KEYSTORE_PASSWORD" >/tmp/anu-alias.out 2>/tmp/anu-alias.err; then
            echo "ERROR: keystore opens, but alias 'anu' is unavailable."
            sed -E 's/(password|storepass|keypass)[^:]*:.*/\1: [REDACTED]/Ig' /tmp/anu-alias.err | head -20
            exit 1
          fi
          ACTUAL_SHA256="$(keytool -list -v -keystore anu-release.jks -alias anu -storepass "$ANU_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED_SHA256="92:79:36:74:05:FE:9A:70:56:EF:18:8D:18:05:BC:E5:42:26:74:FD:58:83:E0:59:EE:DC:29:C9:76:E3:E8:0B"
          echo "GitHub decoded keystore SHA-256: ${ACTUAL_SHA256:-NOT_FOUND}"
          echo "Expected permanent Anu SHA-256: $EXPECTED_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: fingerprint mismatch. The GitHub secret contains a different keystore."
            exit 1
          fi
          echo "Permanent Anu signing keystore validation: OK"

      - name: Create local.properties
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check source tree
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          test -s app/src/main/java/com/ghaniram/zoya/ZoyaSessionManager.kt
          test -s app/src/main/java/com/ghaniram/zoya/AnuSettingsStore.kt
          echo "Committed Kotlin source verified; no generated source mutation will run in CI."

      - name: Build debug APK
        shell: bash
        env:
          ANU_KEYSTORE_PASSWORD: ${{ secrets.ANU_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          test -n "$ANU_KEYSTORE_PASSWORD"
          ./gradlew --no-daemon --stacktrace --info clean assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER" || { echo "ERROR: apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Create GitHub Release and upload APK
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="anu-build-${{ github.run_number }}"
          gh release create "$TAG" "$APK#Anu-debug.apk" --repo "${{ github.repository }}" --title "Anu APK build ${{ github.run_number }}" --notes "Automated Anu debug APK build from commit ${{ github.sha }}." --target "${{ github.sha }}"
