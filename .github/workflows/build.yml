name: Build Anu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anu-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s debug.keystore

      - name: Create local.properties
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check source tree
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          test -s app/src/main/java/com/ghaniram/zoya/ZoyaSessionManager.kt
          test -s app/src/main/java/com/ghaniram/zoya/AnuSettingsStore.kt
          echo "Committed Kotlin source verified; no generated source mutation will run in CI."

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info clean assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android build-tools apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Create GitHub Release and upload APK
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="anu-build-${{ github.run_number }}"
          TITLE="Anu APK build ${{ github.run_number }}"
          gh release create "$TAG" "$APK#Anu-debug.apk" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Automated Anu debug APK build from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

      - name: Upload build log on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s gradle-build.log ]; then
            exit 0
          fi
          TAG="anu-build-failed-${{ github.run_number }}"
          gh release create "$TAG" gradle-build.log#gradle-build.log \
            --repo "${{ github.repository }}" \
            --title "Anu failed build log ${{ github.run_number }}" \
            --notes "Automated Gradle build log for failed run ${{ github.run_id }}." \
            --target "${{ github.sha }}" || true
