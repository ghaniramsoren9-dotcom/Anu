name: Build Anu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore and validate permanent Anu signing keystore
        shell: bash
        env:
          ANU_KEYSTORE_BASE64: ${{ secrets.ANU_KEYSTORE_BASE64 }}
          ANU_KEYSTORE_PASSWORD: ${{ secrets.ANU_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANU_KEYSTORE_BASE64"
          test -n "$ANU_KEYSTORE_PASSWORD"
          STORE_PASSWORD="$(printf '%s' "$ANU_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          printf '%s' "$ANU_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > debug.keystore
          test -s debug.keystore
          keytool -list -v -keystore debug.keystore -alias anu -storepass "$STORE_PASSWORD" >/tmp/keytool.txt
          ACTUAL_SHA256="$(awk -F': ' '/SHA256:/{print $2; exit}' /tmp/keytool.txt)"
          EXPECTED_SHA256="87:7D:C9:7A:8B:30:9D:53:24:F0:F9:62:BF:0C:DE:81:0E:47:8A:32:72:53:B2:AC:33:7A:48:4C:DB:01:78:90"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
      - name: Create local.properties
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
      - name: Validate source before build
        shell: bash
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/com/ghaniram/zoya/MainActivity.kt"
          test -s "$MAIN"
          grep -q 'class MainActivity : ComponentActivity()' "$MAIN"
          # Remove only the incompatible modifier; never rewrite/restore the source tree here.
          sed -i 's/\.focusable()//g' "$MAIN"
          ! grep -q '\.focusable()' "$MAIN"
          # Ensure the greeting state is declared only once inside AnuHomeScreen.
          awk '
            /fun AnuHomeScreen\(/ { in_home=1; next }
            in_home && /^}\s*$/ { in_home=0 }
            in_home && /val settingsStore = remember \{ AnuSettingsStore.getInstance\(context\) \}/ { settings++ }
            in_home && /val userName = settingsStore.userName.trim\(\).ifBlank \{ "Ghaniram" \}/ { user++ }
            in_home && /var currentHour by remember \{ mutableIntStateOf/ { hour++ }
            END { exit !(settings == 1 && user == 1 && hour == 1) }
          ' "$MAIN"
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --info -Pkotlin.compiler.execution.strategy=in-process clean assembleDebug 2>&1 | tee gradle-build.log
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
