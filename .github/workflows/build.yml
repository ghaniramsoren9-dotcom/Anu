name: Build Anu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anu-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore permanent signing keystore
        shell: bash
        env:
          ANU_KEYSTORE_BASE64: ${{ secrets.ANU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANU_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANU_KEYSTORE_BASE64 repository secret is required."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/anu-signing"
          printf '%s' "$ANU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anu-signing/anu-release.jks"
          test -s "$RUNNER_TEMP/anu-signing/anu-release.jks"

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply reference-inspired UI polish
        run: python3 tools/refine_ui.py

      - name: Patch Chat builder for current Gemini client
        run: python3 tools/patch_chat_builder.py

      - name: Apply complete Chat implementation
        run: python3 tools/complete_chat.py

      - name: Enable real CameraX Vision screen
        run: python3 tools/enable_real_vision.py

      - name: Route Vision into Anu shared Gemini Live session
        run: python3 tools/use_shared_live_vision.py

      - name: Repair generated Kotlin imports
        run: python3 tools/fix_build.py

      - name: Finalize Anu chat and live vision behavior
        run: python3 tools/finalize_anu.py

      - name: Repair persistent conversation archive and voice turns
        run: python3 tools/repair_chat_vision.py

      - name: Harden long-running Live microphone session
        run: python3 tools/repair_long_live.py

      - name: Add Gemini Live session resumption and reconnect recovery
        run: python3 tools/repair_live_resumption.py

      - name: Normalize generated Kotlin before compile
        run: python3 tools/repair_compile.py

      - name: Build signed APK with retry
        shell: bash
        env:
          ANU_KEYSTORE_FILE: ${{ runner.temp }}/anu-signing/anu-release.jks
          ANU_KEYSTORE_PASSWORD: ${{ secrets.ANU_KEYSTORE_PASSWORD }}
          ANU_KEY_ALIAS: ${{ secrets.ANU_KEY_ALIAS }}
          ANU_KEY_PASSWORD: ${{ secrets.ANU_KEY_PASSWORD }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew --no-daemon --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after dependency/network backoff..."
              sleep $((15 * attempt))
            fi
          done
          exit 1

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android build-tools apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
