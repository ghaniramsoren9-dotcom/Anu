name: Apply Anu TimePicker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ghaniram/zoya/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          if 'TimePickerWithPresetsDialog' in s:
              print('TimePicker integration already present')
              raise SystemExit(0)
          marker = 'import com.ghaniram.zoya.ui.theme.*\n'
          if marker not in s:
              raise SystemExit('theme import marker not found')
          s = s.replace(marker, marker + 'import com.ghaniram.zoya.ui.TimePickerWithPresetsDialog\n', 1)
          needle = '''                    OutlinedTextField(\n                        value = newTaskTime,\n                        onValueChange = { newTaskTime = it },\n                        label = { Text("Time (e.g. 7:00 PM)") },\n                        singleLine = true,\n                        modifier = Modifier.fillMaxWidth()\n                    )'''
          replacement = '''                    var showTimePickerDialog by remember { mutableStateOf(false) }\n\n                    OutlinedTextField(\n                        value = newTaskTime,\n                        onValueChange = { newTaskTime = it },\n                        label = { Text("Time (e.g. 7:00 PM)") },\n                        singleLine = true,\n                        trailingIcon = {\n                            IconButton(onClick = { showTimePickerDialog = true }) {\n                                Icon(\n                                    Icons.Filled.Schedule,\n                                    contentDescription = "Pick Time",\n                                    tint = MaterialTheme.colorScheme.primary\n                                )\n                            }\n                        },\n                        modifier = Modifier.fillMaxWidth()\n                    )\n                    Spacer(modifier = Modifier.height(6.dp))\n                    Text(\n                        text = "Quick Presets:",\n                        fontSize = 11.sp,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant\n                    )\n                    Spacer(modifier = Modifier.height(4.dp))\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(6.dp)\n                    ) {\n                        listOf(15 to "+15m", 30 to "+30m", 60 to "+1h").forEach { (min, label) ->\n                            AssistChip(\n                                onClick = {\n                                    val cal = Calendar.getInstance().apply { add(Calendar.MINUTE, min) }\n                                    val ampm = if (cal.get(Calendar.AM_PM) == Calendar.AM) "AM" else "PM"\n                                    val h = if (cal.get(Calendar.HOUR) == 0) 12 else cal.get(Calendar.HOUR)\n                                    newTaskTime = String.format(Locale.US, "%d:%02d %s", h, cal.get(Calendar.MINUTE), ampm)\n                                },\n                                label = { Text(label, fontSize = 11.sp) }\n                            )\n                        }\n                        AssistChip(\n                            onClick = { showTimePickerDialog = true },\n                            label = { Text("🕒 Clock", fontSize = 11.sp) }\n                        )\n                    }\n                    if (showTimePickerDialog) {\n                        TimePickerWithPresetsDialog(\n                            onConfirm = { hour, minute ->\n                                val ampm = if (hour >= 12) "PM" else "AM"\n                                val h12 = if (hour % 12 == 0) 12 else hour % 12\n                                newTaskTime = String.format(Locale.US, "%d:%02d %s", h12, minute, ampm)\n                                showTimePickerDialog = false\n                            },\n                            onDismiss = { showTimePickerDialog = false }\n                        )\n                    }'''
          if needle not in s:
              raise SystemExit('newTaskTime field did not match expected current source')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'TimePickerWithPresetsDialog' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'Quick Presets:' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          grep -q 'Icons.Filled.Schedule' app/src/main/java/com/ghaniram/zoya/MainActivity.kt
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ghaniram/zoya/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add task time picker quick presets'
          git push
