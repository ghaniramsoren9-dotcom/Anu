name: GitHub Tool Bridge v2

on:
  push:
    paths:
      - '.github/workflows/github-tool-bridge-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply GitHub tool bridge
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
      - name: Commit source patch
        run: |
          if git diff --quiet -- app/src/main/java/com/ghaniram/zoya/ZoyaSessionManager.kt; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ghaniram/zoya/ZoyaSessionManager.kt
          git commit -m 'fix: expose GitHub repository actions to Anu chat'
          git push
